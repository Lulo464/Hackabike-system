services:
  nodered:
    build:
      context: .
      dockerfile: dockerfiles/nodered/Dockerfile
    container_name: bikestation-nodered
    # Without this the container runs on UTC while the host is Europe/Berlin,
    # so anything that renders a local time (e.g. the last RFID tap) is 2h off.
    environment:
      - TZ=Europe/Berlin
      # read by the postgreSQLConfig node (user/password fields set to "env"),
      # so no DB credentials end up in flows.json
      - PGUSER=${POSTGRES_USER:-nodered}
      - PGPASSWORD=${POSTGRES_PASSWORD:-hackathon2026}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    restart: unless-stopped

  mosquitto:
    build:
      context: .
      dockerfile: dockerfiles/mosquitto/Dockerfile
    container_name: bikestation-mosquitto
    ports:
      - "1883:1883"   # MQTT over TCP   (ESP32 -> broker)
      - "9001:9001"   # MQTT over WS    (browser / Node-RED)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bikestation-postgres
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_DB=bikestation
      - POSTGRES_USER=${POSTGRES_USER:-nodered}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hackathon2026}
    ports:
      - "5432:5432"   # psql / Grafana from the LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # *.sql in here runs once, on the first start with an empty data volume
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # mobile dashboard, forecast and app access to the gate - reads only the db,
  # publishes to MQTT only to open/close the gate
  web:
    build:
      context: ./web
    container_name: bikestation-web
    environment:
      - TZ=Europe/Berlin
      - PGHOST=postgres
      - PGDATABASE=bikestation
      - PGUSER=${POSTGRES_USER:-nodered}
      - PGPASSWORD=${POSTGRES_PASSWORD:-hackathon2026}
      - MQTT_URL=mqtt://mosquitto:1883
      # code needed to create an account - the dashboard is reachable from
      # the internet through Pangolin (see README, "Remote access")
      - REGISTRATION_CODE=${REGISTRATION_CODE:-Hack-a-bike}
      - GATE_OPEN_SECONDS=8
      - CLEANUP_INTERVAL_MIN=5
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
