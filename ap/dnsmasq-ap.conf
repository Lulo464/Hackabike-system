# dnsmasq — DHCP + DNS for the Hackabike AP.
#
# Serves leases ONLY on the AP subnet (192.168.50.0/24). It must never answer
# DHCP on the school LAN (eth0) or on Docker's bridges, or it would fight the
# real DHCP server there.
#
# NetworkManager's built-in dnsmasq was previously used for this, but it only
# runs with ipv4.method=shared, which made wlan0 take a default route via
# 10.42.0.1 and broke the intended 192.168.50.1 addressing. A standalone
# dnsmasq keeps the AP statically addressed and the ESP32 still gets a lease.

# Only answer on the AP interface.
# NB: bind-dynamic and bind-interfaces are mutually exclusive. bind-dynamic is
# required here because wlan0 is an AP (it has no carrier until a client
# associates), so its address is not bound at dnsmasq start.
interface=wlan0
bind-dynamic

# Do not serve DHCP on any other interface (school LAN, docker0, bridges).
except-interface=lo
except-interface=eth0
except-interface=docker0

# Listen on the AP address only, not 0.0.0.0.
listen-address=192.168.50.1

# DHCP: lease .100 - .150, hand out the AP as router and DNS.
# NB: numeric option codes only. This dnsmasq rejects the "option:" prefixed
# forms in a standalone (--conf-file only) test.
dhcp-range=192.168.50.100,192.168.50.150,255.255.255.0,12h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1
dhcp-option=1,255.255.255.0

# Stable leases so the ESP32 keeps its broker address.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Log via syslog so it lands in journalctl. Do NOT use /dev/stdout: the
# systemd unit has no such device and dnsmasq exits with NOTIMPLEMENTED.
log-queries
