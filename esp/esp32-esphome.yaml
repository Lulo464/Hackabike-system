      pinMode(SIG, INPUT);
      unsigned long us = pulseIn(SIG, HIGH, 30000);
      if (us == 0) id(sensor_fails)[N]++; else id(sensor_fails)[N] = 0;
      int s = id(sensor_fails)[N] >= 3 ? 0 : 1;
      if (id(sensor_state)[N] != s) {
        if (id(mqtt_client)->publish("bikestation/slot3/sensor", s ? "ok" : "no_echo", 0, true))
          id(sensor_state)[N] = s;
      }
      if (us == 0) return 999.0f;
      return us / 58.0f;

  # Slot 4 -> D22
  - platform: template
    name: "Distance Slot 4"
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 1300ms
    state_topic: bikestation/slot4/distance
    lambda: |-
      const int SIG = 22;
      const int N = 3;
      pinMode(SIG, OUTPUT);
      digitalWrite(SIG, LOW);  delayMicroseconds(2);
      digitalWrite(SIG, HIGH); delayMicroseconds(10);
      digitalWrite(SIG, LOW);
      pinMode(SIG, INPUT);
      unsigned long us = pulseIn(SIG, HIGH, 30000);
      if (us == 0) id(sensor_fails)[N]++; else id(sensor_fails)[N] = 0;
      int s = id(sensor_fails)[N] >= 3 ? 0 : 1;
      if (id(sensor_state)[N] != s) {
        if (id(mqtt_client)->publish("bikestation/slot4/sensor", s ? "ok" : "no_echo", 0, true))
