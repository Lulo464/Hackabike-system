# ESP 1 (ESP32 DevKit): WS2812B-Strip fuer alle 4 Slots + Ultrasonic Slot 1/2 + MQTT
# Slot 3/4 misst ESP 2 (esp32-esphome-2.yaml). D21/D23 sind frei.
esphome:
  name: bikeslot-test
  on_boot:
    priority: -100
    then:
      # Reset beim Boot: Messung sperren, alle Slots auf "aus", LEDs löschen
      - lambda: |-
          id(ready) = false;
          for (int i = 0; i < 4; i++) id(slots)[i] = 0;
          for (int i = 0; i < 2; i++) {
            id(sensor_state)[i] = -1;
            id(sensor_fails)[i] = 0;
          }
          id(next_sensor) = 0;
      - light.turn_off:
          id: strip
          transition_length: 0s
      - delay: 2s
      - light.turn_on:
          id: strip
          brightness: 30%
          effect: "Slots"
      # Erst nach dem Hochfahren (WLAN, MQTT, Strom stabil) wird gemessen
      - delay: 5s
      - lambda: 'id(ready) = true;'

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

# Kein Home Assistant: ohne reboot_timeout: 0s startet der ESP alle 15 min neu
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: "Hackabike-ESP"
  password: "hackabike2026"
  power_save_mode: none

globals:
  # LED-Zustand aller 4 Slots: 0=aus, 1=free, 2=occupied, 3=reserved, 4=alarm
  - id: slots
    type: int[4]
    initial_value: '{0, 0, 0, 0}'
  # letzter gemeldeter Sensorstatus (Slot 1/2): -1=unbekannt, 0=no_echo, 1=ok
  - id: sensor_state
    type: int[2]
    initial_value: '{-1, -1}'
  # Anzahl aufeinanderfolgender Fehlmessungen (Slot 1/2)
  - id: sensor_fails
    type: int[2]
    initial_value: '{0, 0}'
  # welcher Sensor als Nächstes misst (0-1)
  - id: next_sensor
    type: int
    initial_value: '0'
  # Messfreigabe nach dem Boot
  - id: ready
    type: bool
    initial_value: 'false'

mqtt:
  id: mqtt_client
  broker: 192.168.50.1
  port: 1883
  client_id: bikeslot-test
  discovery: false
  birth_message:
    topic: bikestation/bikeslot-test/status
    payload: online
  will_message:
    topic: bikestation/bikeslot-test/status
    payload: offline
  on_message:
    - topic: bikestation/slot1/state
      then:
        - lambda: |-
            id(slots)[0] = x == "free" ? 1 : x == "occupied" ? 2 : x == "reserved" ? 3 : x == "alarm" ? 4 : 0;
    - topic: bikestation/slot2/state
      then:
        - lambda: |-
            id(slots)[1] = x == "free" ? 1 : x == "occupied" ? 2 : x == "reserved" ? 3 : x == "alarm" ? 4 : 0;
    - topic: bikestation/slot3/state
      then:
        - lambda: |-
            id(slots)[2] = x == "free" ? 1 : x == "occupied" ? 2 : x == "reserved" ? 3 : x == "alarm" ? 4 : 0;
    - topic: bikestation/slot4/state
      then:
        - lambda: |-
            id(slots)[3] = x == "free" ? 1 : x == "occupied" ? 2 : x == "reserved" ? 3 : x == "alarm" ? 4 : 0;

light:
  - platform: esp32_rmt_led_strip
    id: strip
    name: "Strip"
    pin: GPIO13
    num_leds: 20            # 4 * LEDS_PER_SLOT + 3 * GAP
    chipset: WS2812
    channel_colors: GRB
    effects:
      - addressable_lambda:
          name: "Slots"
          update_interval: 100ms
          lambda: |-
            const int LEDS_PER_SLOT = 2;
            const int GAP = 4;
            bool slow = (millis() / 500) % 2;
            bool fast = (millis() / 150) % 2;
            it.all() = Color::BLACK;
            for (int i = 0; i < 4; i++) {
              Color c = Color::BLACK;
              switch (id(slots)[i]) {
                case 1: c = Color(0, 255, 0); break;
                case 2: c = Color(255, 0, 0); break;
                case 3: c = slow ? Color(0, 0, 255) : Color::BLACK; break;
                case 4: c = fast ? Color(255, 0, 0) : Color::BLACK; break;
              }
              int start = i * (LEDS_PER_SLOT + GAP);
              for (int j = 0; j < LEDS_PER_SLOT; j++) it[start + j] = c;
            }

# Distanz-Sensoren: Werte kommen aus dem interval-Block unten.
# retain: false -> der Pi bekommt nach einem Neustart keinen alten Wert.
# skip_initial verwirft die ersten 2 Messungen, der Median glättet Ausreißer.
sensor:
  - platform: template
    id: dist1
    name: "Distance Slot 1"
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: never
    state_topic: bikestation/slot1/distance
    retain: false
    filters:
      - skip_initial: 2
      - median: {window_size: 5, send_every: 1, send_first_at: 1}

  - platform: template
    id: dist2
    name: "Distance Slot 2"
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: never
    state_topic: bikestation/slot2/distance
    retain: false
    filters:
      - skip_initial: 2
      - median: {window_size: 5, send_every: 1, send_first_at: 1}

# Alle 100 ms misst genau ein Sensor (D18, D19), abwechselnd -> je Slot alle 200 ms
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(ready)) return;   // nicht messen, solange der Boot läuft

          static const int pins[2] = {18, 19};
          static const int slot_base = 1;   // pins[0] -> slot1
          int n = id(next_sensor);
          id(next_sensor) = (n + 1) % 2;
          int sig = pins[n];

          pinMode(sig, OUTPUT);
          digitalWrite(sig, LOW);  delayMicroseconds(2);
          digitalWrite(sig, HIGH); delayMicroseconds(10);
          digitalWrite(sig, LOW);
          pinMode(sig, INPUT);
          unsigned long us = pulseIn(sig, HIGH, 30000);

          // Sensorstatus: erst nach 3 Fehlmessungen in Folge "no_echo"
          if (us == 0) id(sensor_fails)[n]++; else id(sensor_fails)[n] = 0;
          int s = id(sensor_fails)[n] >= 3 ? 0 : 1;
          if (id(sensor_state)[n] != s) {
            char topic[32];
            snprintf(topic, sizeof(topic), "bikestation/slot%d/sensor", slot_base + n);
            if (id(mqtt_client)->publish(topic, s ? "ok" : "no_echo", 0, true))
              id(sensor_state)[n] = s;
          }

          // kein Echo -> unplausibler Wert 999
          float cm = (us == 0) ? 999.0f : us / 58.0f;
          if (n == 0) id(dist1).publish_state(cm);
          if (n == 1) id(dist2).publish_state(cm);
