# ─────────────────────────────────────────────────────────────
# Smart Bikestation — Mosquitto broker configuration
# ─────────────────────────────────────────────────────────────

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning

# ── Authentication ──────────────────────────────────────────
# Anonymous access is enabled because this is an isolated
# school-LAN demo and the ESP32 must connect without credential
# handling on day one.
#
# TO HARDEN (recommended before the network is exposed, and the
# right answer for the security/threat-model part of the brief):
#   1. docker compose exec mosquitto mosquitto_passwd -c \
#        /mosquitto/config/passwd esp32 bikestation
#   2. docker compose exec mosquitto mosquitto_passwd -a \
#        /mosquitto/config/passwd nodered nodered
#   3. set `allow_anonymous false` below
#   4. restart both containers
allow_anonymous true
# password_file /mosquitto/config/passwd

# ── Listeners ───────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Topic scope ─────────────────────────────────────────────
# Everything the bikestation uses lives under the single root
# `bikestation/`. Traffic on any other root is rejected, so a
# stray publisher on the LAN cannot pollute the broker.
#
#   bikestation/entrance/nfc/tap          ESP32 -> broker   {"uid":"A1B2","timestamp":"..."}
#   bikestation/entrance/oled/display     broker -> ESP32   {"text":"Welcome!"}
#   bikestation/slot/{1..4}/proximity     ESP32 -> broker   {"distance_cm":45.2,"occupied":true}
#   bikestation/slot/{1..4}/vibration     ESP32 -> broker   {"g_force":0.02,"alert":false}
#   bikestation/slot/{1..4}/led           broker -> ESP32   {"slot":1,"color":"green","blink":false}
#   bikestation/system/alerts             ESP32 -> broker   {"type":"sabotage","slot":2,"timestamp":"..."}
#   bikestation/system/status             ESP32 -> broker   LWT {"status":"online"}
