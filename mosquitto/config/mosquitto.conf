# ─────────────────────────────────────────────────────────────
# Smart Bikestation — Mosquitto broker configuration
# ─────────────────────────────────────────────────────────────

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning

# ── Authentication ──────────────────────────────────────────
# Anonymous access is enabled because this is an isolated
# school-LAN demo and the ESP32 must connect without credential
# handling on day one.
#
# TO HARDEN (recommended before the network is exposed, and the
# right answer for the security/threat-model part of the brief):
#   1. docker compose exec mosquitto mosquitto_passwd -c \
#        /mosquitto/config/passwd esp32 bikestation
#   2. docker compose exec mosquitto mosquitto_passwd -a \
#        /mosquitto/config/passwd nodered nodered
#   3. set `allow_anonymous false` below
#   4. restart both containers
allow_anonymous true
# password_file /mosquitto/config/passwd

# ── Listeners ───────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Topics ──────────────────────────────────────────────────
# Everything the bikestation uses lives under `bikestation/`.
# There is no ACL: any client may read and write any topic.
# Topic list: README.md, section "MQTT topics". Setup and hardening:
# mosquitto/README.md.
